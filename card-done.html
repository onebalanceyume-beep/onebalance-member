<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>カード登録 完了｜ワンバランスボクシングジム</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:Helvetica,Arial,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
.w{max-width:480px;margin:0 auto;padding:56px 20px;text-align:center}
.mark{width:72px;height:72px;border-radius:50%;background:#DD0B1B;color:#fff;font-size:40px;line-height:72px;margin:0 auto 20px}
h1{font-size:24px;margin:0 0 14px}p{font-size:15px;line-height:1.8;color:#333;margin:0 0 10px}
.ng .mark{background:#999}
</style></head><body>
<div class="w" id="w">
  <div class="mark" id="m">✓</div>
  <h1 id="t">カードを登録しました</h1>
  <p id="p1">今日は課金されません。<br>入会日に、ジムでお待ちしています。</p>
  <p style="font-size:13px;color:#777">ワンバランスボクシングジム｜TEL 0859-49-5275</p>
</div>
<script>
try{
  if(new URLSearchParams(location.search).get('ok') === '0'){
    document.getElementById('w').className = 'w ng';
    document.getElementById('m').textContent = '!';
    document.getElementById('t').textContent = '登録は完了していません';
    document.getElementById('p1').innerHTML = 'お手数ですが、入会アプリの完了画面から、もう一度お試しください。<br>分からないときは、スタッフにお声がけください。';
  }
}catch(e){}
</script></body></html>
